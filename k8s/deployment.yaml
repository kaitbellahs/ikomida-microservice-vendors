apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vendors
  name: vendors-microservice
  namespace: ikomida
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendors
  template:
    metadata:
      labels:
        app: vendors
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - image: us-central1-docker.pkg.dev/$PROJECT_ID/docker/vendors-microservice-image:latest
          name: vendors-microservice
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 1988
          resources:
            requests:
              cpu: "18m"
              memory: "72Mi"
            limits:
              cpu: "150m"
          env:
            - name: PORT
              value: "1988"
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: NODE_ENV
                  optional: false
            - name: IKOMIDA_PRIVATEKEY
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: IKOMIDA_PRIVATEKEY
                  optional: false
            - name: IKOMIDA_PUBLICKEY
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: IKOMIDA_PUBLICKEY
                  optional: false
            - name: GOOGLEADMIN
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: googleAdmin
                  optional: false
            - name: DBUSER
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBUSER
            - name: DBPASS
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBPASS
            - name: DBNAME
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBNAME
            - name: DBHOST
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBHOST
            - name: DBPORT
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBPORT
            - name: PROJID
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PROJID
            - name: PAGSEGURO_EMAIL
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PAGSEGURO_EMAIL
                  optional: false
            - name: PAGSEGURO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PAGSEGURO_TOKEN
                  optional: false
            - name: PAGSEGURO_APP
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PAGSEGURO_APP
                  optional: false
